name: Controle Pages-publicatie
on:
  pull_request:
    paths:
      - 'scripts/deploy_pages.py'
      - 'tests/test_deploy_pages.py'
      - '.github/workflows/radar.yml'
      - '.github/workflows/pages-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pages-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installeer testafhankelijkheden
        run: python -m pip install 'requests>=2.32,<3'
      - name: Controleer syntax
        run: python -m py_compile scripts/deploy_pages.py
      - name: Test artifact-verificatie
        run: python -m unittest discover -s tests -p 'test_deploy_pages.py' -v
