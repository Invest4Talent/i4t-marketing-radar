name: Controle mediabronnen
on:
  pull_request:
    paths:
      - 'scripts/media_sources.py'
      - 'scripts/update_radar.py'
      - 'tests/test_media_sources.py'
      - '.github/workflows/media-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  media-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install testafhankelijkheden
        run: python -m pip install 'requests>=2.32,<3' 'trafilatura>=2,<3'
      - name: Controleer mediascripts op syntax
        run: python -m py_compile scripts/media_sources.py scripts/update_radar.py
      - name: Test paywall- en relevantiefilters
        run: python -m unittest discover -s tests -p 'test_media_sources.py' -v
