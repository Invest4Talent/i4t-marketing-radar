name: Go4Jobs Radar - dagelijks bijwerken en publiceren
on:
  push:
    branches: [main]
    paths-ignore:
      - 'radar-data.json'
  schedule:
    # GitHub kan geplande jobs vertragen of overslaan. Twee onafhankelijke
    # tijdstippen spreiden het risico; op beide draait dezelfde idempotente flow.
    - cron: '17 6 * * *'   # 07:17 CET / 08:17 CEST
    - cron: '43 13 * * *'  # 14:43 CET / 15:43 CEST
  workflow_dispatch:
    inputs:
      prepare_branch:
        description: 'Eenmalig de gh-pages-branch voorbereiden zonder de huidige Pages-publicatie te wijzigen'
        required: false
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://invest4talent.github.io/i4t-marketing-radar/
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'requests>=2.32,<3' 'trafilatura>=2,<3' 'googlenewsdecoder==0.1.7' 'selectolax==0.4.13' 'google-auth>=2,<3'
      - name: Test filter voor publiek leesbare media
        run: python -m unittest discover -s tests -p 'test_media_sources.py' -v
      - name: Authenticeer bij Google Cloud via GitHub OIDC
        id: gsc_auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/830417487369/locations/global/workloadIdentityPools/github-actions/providers/-github-actions'
          service_account: 'go4jobs-radar@go4jobs-marketing-radar.iam.gserviceaccount.com'
          create_credentials_file: true
      - name: Controleer Search Console-zichtbaarheid (geen ruwe zoekopdrachten publiceren)
        if: steps.gsc_auth.outcome == 'success'
        continue-on-error: true
        env:
          GSC_SITE_URL: 'sc-domain:go4jobs.be'
        run: python scripts/gsc_interest.py
      - name: Update nieuwsfeed en optionele AI-analyse
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-6-luna
          # Beperk nieuwe betaalde bronanalyses per uitvoering.
          MAX_AI_PER_RUN: '5'
        run: python scripts/update_radar.py
      - name: Bewaar de nieuwe broncontrole en artikelhistoriek
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar-data.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: vernieuw marketingradar-data [skip ci]"
            git push
          fi
      - name: Prepare public website
        run: |
          mkdir -p public
          cp index.html radar-data.json public/
          touch public/.nojekyll
      # De bestaande artifact-publicatie blijft actief tot de overstap
      # expliciet via de repositoryvariabele RADAR_PAGES_MODE is ingeschakeld.
      - uses: actions/configure-pages@v5
        if: ${{ vars.RADAR_PAGES_MODE != 'branch' && inputs.prepare_branch != true }}
      - name: Upload GitHub Pages artifact
        if: ${{ vars.RADAR_PAGES_MODE != 'branch' && inputs.prepare_branch != true }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - name: Publiceer GitHub Pages via bevestigd artifact-ID
        if: ${{ vars.RADAR_PAGES_MODE != 'branch' && inputs.prepare_branch != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/deploy_pages.py
      # Gebruik bewust geen GITHUB_TOKEN: GitHub Pages bouwt geen site na
      # een branch-push die met het ingebouwde GITHUB_TOKEN is gedaan.
      - name: Controleer apart publicatietoken voor gh-pages
        if: ${{ vars.RADAR_PAGES_MODE == 'branch' || inputs.prepare_branch == true }}
        env:
          PAGES_PUBLISH_TOKEN: ${{ secrets.PAGES_PUBLISH_TOKEN }}
        run: |
          if [ -z "$PAGES_PUBLISH_TOKEN" ]; then
            echo "::error::Repository-secret PAGES_PUBLISH_TOKEN ontbreekt. Stel een beperkt token in vóór branch-publicatie."
            exit 1
          fi
      - name: Schrijf website naar gh-pages-branch
        if: ${{ vars.RADAR_PAGES_MODE == 'branch' || inputs.prepare_branch == true }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_PUBLISH_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          enable_jekyll: false
