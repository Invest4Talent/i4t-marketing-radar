name: Go4Jobs Radar - dagelijks bijwerken en publiceren
on:
  push:
    branches: [main]
    paths-ignore:
      - 'radar-data.json'
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'requests>=2.32,<3' 'trafilatura>=2,<3' 'googlenewsdecoder==0.1.7' 'selectolax==0.4.13' 'google-auth>=2,<3'
      - name: Test filter voor publiek leesbare media
        run: python -m unittest discover -s tests -p 'test_media_sources.py' -v
      - name: Authenticeer bij Google Cloud via GitHub OIDC
        id: gsc_auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/830417487369/locations/global/workloadIdentityPools/github-actions/providers/-github-actions'
          service_account: 'go4jobs-radar@go4jobs-marketing-radar.iam.gserviceaccount.com'
          create_credentials_file: true
      - name: Controleer Search Console-zichtbaarheid (geen ruwe zoekopdrachten publiceren)
        if: steps.gsc_auth.outcome == 'success'
        continue-on-error: true
        env:
          GSC_SITE_URL: 'sc-domain:go4jobs.be'
        run: python scripts/gsc_interest.py
      - name: Update nieuwsfeed en optionele AI-analyse
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-6-luna
          # Beperk nieuwe betaalde bronanalyses per uitvoering.
          MAX_AI_PER_RUN: '5'
        run: python scripts/update_radar.py
      - name: Bewaar de nieuwe broncontrole en artikelhistoriek
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar-data.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: vernieuw marketingradar-data [skip ci]"
            git push
          fi
      - name: Prepare public website
        run: |
          mkdir -p public
          cp index.html radar-data.json public/
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - name: Wacht tot publicatiebestand zichtbaar is bij GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Een upload kan kort na afloop nog niet zichtbaar zijn via de artifact-API.
          # Probeer opnieuw voordat deploy-pages dit bestand opvraagt.
          for poging in 1 2 3 4 5 6; do
            artifact_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' || true)
            if [ -n "$artifact_id" ]; then
              echo "GitHub Pages-artifact beschikbaar: $artifact_id"
              exit 0
            fi
            echo "Publicatiebestand nog niet zichtbaar (poging $poging/6)."
            sleep 10
          done
          echo "::error::Uploadstap afgerond, maar github-pages-artifact blijft onvindbaar. Controleer Actions-artifacts."
          exit 1
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
